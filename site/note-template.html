<style>
__THEME_CSS__
:root {
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --ordinal-1: #86b6ef; --ordinal-2: #3987e5; --ordinal-3: #1c5cab; --ordinal-4: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --ordinal-1: #184f95; --ordinal-2: #2a78d6; --ordinal-3: #6da7ec; --ordinal-4: #b7d3f6; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; overflow-wrap: anywhere; }
a { color: var(--accent); }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
h2 { font-size: 20px; margin: 36px 0 10px; }
h3 { font-size: 16px; margin: 24px 0 8px; }
p, ul, ol { margin: 0 0 14px; }
code { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 14px; }
pre { margin: 0; overflow-x: auto; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
pre.code { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
.cell { margin: 0 0 20px; }
.cell pre.code { margin-bottom: 0; }
.cell-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin: 0 0 4px; }
.cell pre.code + .cell-label { margin-top: 8px; }
.cell-label span { float: right; }
pre.output { border-left: 3px solid var(--accent); white-space: pre-wrap; word-break: break-all; }
.table-wrap { overflow-x: auto; margin: 0 0 14px; }
.table-wrap.output { border-left: 3px solid var(--accent); padding-left: 8px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.output td { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: nowrap; }
.output td.long { white-space: normal; word-break: break-all; min-width: 16ch; }
th { white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
.r { text-align: right; }
.math.display { margin: 0 0 14px; overflow-x: auto; overflow-y: hidden; }
blockquote { margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
.chart { margin: 0 0 14px; border-left: 3px solid var(--accent); padding-left: 8px; }
.chart .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.chart .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chart svg { display: block; width: 100%; max-width: 720px; height: auto; }
.tiling { margin: 0 0 14px; --scale: 1.5; }
.tiling .sheet { display: flex; flex-wrap: wrap; width: fit-content; max-width: 100%; overflow: hidden; padding: 0 calc(var(--scale) * var(--pad)) calc(var(--scale) * var(--pad)) 0; }
.tiling .sheet > svg { width: calc(var(--scale) * var(--width)); margin: 0 calc(-1 * var(--scale) * var(--pad)) calc(-1 * var(--scale) * var(--pad)) 0; }
.tiling .sheet .bg { fill: none; }
@media (max-width: 560px) { .tiling { --scale: 1; } }
.tiling figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.chart svg.narrow { display: none; max-width: 480px; }
@media (max-width: 560px) {
  .chart svg.wide { display: none; }
  .chart svg.narrow { display: block; }
}
.toc { font-size: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 10px 14px; margin: 0 0 24px; }
.toc ol { margin: 4px 0 0; padding-left: 20px; }
__CHROME_CSS__
</style>
</head>
<body>
<main>
  __SITE_HEADER__
  <article>
    __CONTENT__
  </article>
  __SITE_FOOTER__
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script>
document.querySelectorAll('.math').forEach(element => {
  if (window.katex) {
    katex.render(element.dataset.tex, element, { displayMode: element.classList.contains('display'), throwOnError: false });
  }
});
</script>
</body>
</html>
