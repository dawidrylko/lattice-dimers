[workspace]
members = ["core"]
default-members = [".", "core"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[package]
name = "lattice-dimers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
lattice-dimers-core = { path = "core" }

[[bin]]
name = "all-lattices-cylinder-torus-bigint"
path = "solvers/src/bin/all-lattices-cylinder-torus-bigint.rs"

[[bin]]
name = "all-lattices-cylinder-torus-modular"
path = "solvers/src/bin/all-lattices-cylinder-torus-modular.rs"

[[bin]]
name = "domicule-cylinder-torus-polynomial-bigint"
path = "solvers/src/bin/domicule-cylinder-torus-polynomial-bigint.rs"

[[bin]]
name = "domicule-cylinder-torus-polynomial-modular"
path = "solvers/src/bin/domicule-cylinder-torus-polynomial-modular.rs"

[[bin]]
name = "domicule-rectangle-polynomial-bigint"
path = "solvers/src/bin/domicule-rectangle-polynomial-bigint.rs"

[[bin]]
name = "domicule-rectangle-polynomial-modular"
path = "solvers/src/bin/domicule-rectangle-polynomial-modular.rs"

[[bin]]
name = "domicule-rectangle-bigint"
path = "solvers/src/bin/domicule-rectangle-bigint.rs"

[[bin]]
name = "domicule-rectangle-modular"
path = "solvers/src/bin/domicule-rectangle-modular.rs"

[[bin]]
name = "domino-rectangle-bigint"
path = "solvers/src/bin/domino-rectangle-bigint.rs"

[[bin]]
name = "domino-rectangle-formula"
path = "solvers/src/bin/domino-rectangle-formula.rs"

[[bin]]
name = "domino-rectangle-number"
path = "solvers/src/bin/domino-rectangle-number.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[dev-dependencies]
libc = "0.2.191"
serde_json = "1.0.154"
