[workspace]
members = ["rust/core"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[package]
name = "lattice-dimers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
lattice-dimers-core = { path = "rust/core" }

[[bin]]
name = "periodic-tiling-modular"
path = "rust/solvers/src/bin/periodic-tiling-modular.rs"
