version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directories:
      - "/python"
      - "/research/king-entropy/src"
      - "/research/king-entropy/replication"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "monthly"
