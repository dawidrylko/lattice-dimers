name: Continuous Integration

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      generator-checks: ${{ steps.jobs.outputs.generator-checks }}
      rust: ${{ steps.jobs.outputs.rust }}
      python: ${{ steps.jobs.outputs.python }}
      javascript: ${{ steps.jobs.outputs.javascript }}
      benchmarks: ${{ steps.jobs.outputs.benchmarks }}
      site-build: ${{ steps.jobs.outputs.site-build }}
      site-tests: ${{ steps.jobs.outputs.site-tests }}
      macos: ${{ steps.jobs.outputs.macos }}
      research: ${{ steps.jobs.outputs.research }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: jobs
        env:
          EVENT: ${{ github.event_name }}
          GENERATOR_INPUTS: '^(oeis/A[0-9]{6}/b[0-9]{6}\.(txt|rs|py|js)$|rust/core/|rust/Cargo\.(toml|lock)$|rust/tests/generators\.rs$|python/lattice_dimers/(__init__\.py$|core/)|python/pyproject\.toml$|python/tests/test_generators\.py$|js/package\.json$|js/\.nvmrc$|js/core/|harness/oeis\.test\.js$|spec/limits\.json$|\.github/workflows/ci\.yml$)'
          SHARED_INPUTS: '^(\.github/workflows/ci\.yml$|spec/|rust/Cargo\.(toml|lock)$|python/pyproject\.toml$|js/(package\.json|pnpm-lock\.yaml|\.nvmrc)$|research/king-entropy/src/requirements\.txt$)'
          REPOSITORY_ONLY: '^(benchmarks|js|python|rust)/README\.md$'
          RUST_INPUTS: '^(rust/|oeis/A[0-9]{6}/b[0-9]{6}\.(rs|txt)$)'
          PYTHON_INPUTS: '^(python/|oeis/A[0-9]{6}/b[0-9]{6}\.(py|txt)$)'
          JAVASCRIPT_INPUTS: '^(js/|site/|\.github/assets/)'
          BENCHMARKS_INPUTS: '^(benchmarks/|rust/|python/|js/|site/benchmarkRuns\.js$)'
          SITE_INPUTS: '^(site/|js/|notes/|benchmarks/results/|research/king-entropy/|oeis/A[0-9]{6}/(A[0-9]{6}\.gp|b[0-9]{6}\.txt)$|\.github/assets/)'
          MACOS_INPUTS: '^(js/|site/|\.github/assets/|research/king-entropy/)'
          RESEARCH_INPUTS: '^(research/king-entropy/|oeis/A239264/b239264\.txt$|\.zenodo\.json$)'
        run: |
          matches() {
            local status=0
            grep -qE "$1" <<< "$2" || status=$?
            if [ "$status" -gt 1 ]; then
              echo "grep failed with status $status on $1." >&2
              exit 1
            fi
            return "$status"
          }
          every=false
          generators=run
          if [ "$EVENT" != pull_request ]; then
            every=true
            echo "Every job and the b-file generators run on $EVENT."
          elif ! git rev-parse --verify -q HEAD^2 > /dev/null; then
            echo "HEAD has no second parent here, so the files the pull request changes are unknown." >&2
            exit 1
          else
            changes=$(git -c core.quotePath=false diff --name-status --no-renames HEAD^1 HEAD)
            files=$(cut -f2 <<< "$changes")
            status=0
            inputs=$(grep -vE "$REPOSITORY_ONLY" <<< "$files") || status=$?
            if [ "$status" -gt 1 ]; then
              echo "grep failed with status $status on $REPOSITORY_ONLY." >&2
              exit 1
            fi
            if matches '^"' "$files"; then
              echo "The pull request changes a file whose name git quotes, so the b-file generators run."
            elif matches "$GENERATOR_INPUTS" "$files"; then
              echo "The pull request changes what the b-file generators depend on, so they run."
            else
              generators=skip
              echo "The pull request changes nothing the b-file generators depend on, so their checks skip."
            fi
            if matches '^D' "$changes"; then
              every=true
              echo "The pull request deletes or moves a file, so every job runs."
            elif matches '^"' "$files"; then
              every=true
              echo "The pull request changes a file whose name git quotes, so every job runs."
            elif matches "$SHARED_INPUTS" "$files"; then
              every=true
              echo "The pull request changes ci.yml, spec/ or a toolchain file, so every job runs."
            fi
          fi
          echo "generator-checks=$generators" >> "$GITHUB_OUTPUT"
          choose() {
            if [ "$every" = true ] || matches "$2" "$inputs"; then
              echo "$1=run" >> "$GITHUB_OUTPUT"
            else
              echo "$1=skip" >> "$GITHUB_OUTPUT"
              echo "The pull request changes nothing the job $1 reads, so it skips."
            fi
          }
          choose rust "$RUST_INPUTS"
          choose python "$PYTHON_INPUTS"
          choose javascript "$JAVASCRIPT_INPUTS"
          choose benchmarks "$BENCHMARKS_INPUTS"
          choose site-build "$SITE_INPUTS"
          choose site-tests "$SITE_INPUTS"
          choose macos "$MACOS_INPUTS"
          choose research "$RESEARCH_INPUTS"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'run'
    runs-on: ubuntu-latest
    env:
      GENERATOR_CHECKS: ${{ needs.changes.outputs.generator-checks }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --release --locked
        working-directory: rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'run'
    runs-on: ubuntu-latest
    env:
      GENERATOR_CHECKS: ${{ needs.changes.outputs.generator-checks }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e "python[test]"
      - run: python -m pytest python/tests -n 4 -m "not timing"
      - run: python -m pytest python/tests -m timing

  javascript:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.javascript == 'run'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm -C js install --frozen-lockfile
      - run: pnpm -C js test

  benchmarks:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.benchmarks == 'run'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm -C js install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --workspace --release --locked
        working-directory: rust
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e python
      - run: pnpm -C js test:benchmarks

  repository:
    name: Repository
    needs: changes
    runs-on: ubuntu-latest
    env:
      GENERATOR_CHECKS: ${{ needs.changes.outputs.generator-checks }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm -C js install --frozen-lockfile
      - run: pnpm -C js test:spec
      - run: pnpm -C js test:oeis
      - run: pnpm -C js test:markdown
      - run: pnpm -C js test:numbers
      - run: pnpm -C js test:metadata
      - run: pnpm -C js test:ci
      - id: pari
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: pari
          condarc: |
            channels:
              - conda-forge
          create-args: pari=2.17.3
          cache-environment: true
          init-shell: none
      - run: pnpm -C js test:pari
        env:
          GP_PATH: ${{ steps.pari.outputs.environment-path }}/bin/gp

  site-build:
    name: Site build
    needs: changes
    if: needs.changes.outputs.site-build == 'run'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm -C js install --frozen-lockfile
      - run: node "$GITHUB_WORKSPACE/site/build.js"
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  site-tests:
    name: Site tests ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: [changes, site-build]
    if: needs.changes.outputs.site-tests == 'run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm -C js install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/site
      - run: pnpm -C js test:site
        timeout-minutes: 10
        env:
          SITE_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'run'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: research/king-entropy/src/requirements.txt
      - run: python -m pip install -r research/king-entropy/src/requirements.txt
      - run: node --test js/test/render.test.js
      - run: python src/test_timed.py
        working-directory: research/king-entropy
      - run: python src/lspec.py > "$RUNNER_TEMP/out_lspec.txt" && diff -u out/out_lspec.txt "$RUNNER_TEMP/out_lspec.txt"
        working-directory: research/king-entropy

  research:
    name: Research
    needs: changes
    if: needs.changes.outputs.research == 'run'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/king-entropy

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: research/king-entropy/src/requirements.txt
      - run: python -m pip install -r src/requirements.txt
      - run: python src/test_paths.py
      - run: python src/test_timed.py
      - run: python src/derived.py > "$RUNNER_TEMP/out_derived.txt" && diff -u out/out_derived.txt "$RUNNER_TEMP/out_derived.txt"
      - run: python src/test_regressions.py
      - run: |
          for script in errbar hidden_oos lspec ltest; do
            python "src/$script.py" > "$RUNNER_TEMP/out_$script.txt"
            diff -u "out/out_$script.txt" "$RUNNER_TEMP/out_$script.txt"
          done
      - run: |
          for script in analyze_eig compare_eig; do
            python "$script.py" > "$RUNNER_TEMP/$script.txt"
            diff -u "out/$script.txt" "$RUNNER_TEMP/$script.txt"
          done
        working-directory: research/king-entropy/replication
      - run: python -m json.tool ../../.zenodo.json > /dev/null

  check:
    name: Check
    if: always()
    needs: [changes, rust, python, javascript, benchmarks, repository, site-build, site-tests, macos, research]
    runs-on: ubuntu-latest

    steps:
      - name: Require every job to succeed unless Changes skipped it
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.outputs as $chosen | all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and $chosen[.key] == "skip"))' <<< "$NEEDS" > /dev/null
