name: Continuous Integration

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:render
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pari-gp
      - run: pnpm test:pari
      - run: pnpm site:build
      - run: pnpm test:site
        timeout-minutes: 10

  research:
    name: Research
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/king-entropy

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: research/king-entropy/src/requirements.txt
      - run: python -m pip install -r src/requirements.txt
      - run: python src/test_paths.py
      - run: python src/derived.py > "$RUNNER_TEMP/out_derived.txt" && diff -u out/out_derived.txt "$RUNNER_TEMP/out_derived.txt"
      - run: python -m json.tool ../../.zenodo.json > /dev/null
