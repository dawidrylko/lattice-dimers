[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-dimers"
version = "1.1.0"
description = "The Python implementations of the lattice-dimers solvers."
license = "MIT"
requires-python = ">=3.13"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["lattice_dimers*"]
