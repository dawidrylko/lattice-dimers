[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-dimers"
version = "1.1.0"
description = "The Python implementations of the lattice-dimers solvers."
license = "MIT"
requires-python = ">=3.13"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-xdist==3.8.0"]

[tool.setuptools.packages.find]
include = ["lattice_dimers*"]

[tool.pytest.ini_options]
markers = ["timing: compares a reported time with the wall time of the process, so CI runs it alone, after the parallel run"]
